<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Preview</title>
<style>
  body{margin:0;overflow:hidden;background:#0b1120;}
  #st{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:14px;z-index:9;text-align:center;}
</style>
<script type="importmap">
{"imports":{"three":"/wraps3d/lib/three.module.js","three/addons/":"/wraps3d/lib/"}}
</script>
</head>
<body>
<div id="st">初始化…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const st = document.getElementById('st');
const setSt = t => { st.textContent = t; };

// 从 URL 参数取车型和贴图
const params = new URLSearchParams(location.search);
const modelKey = params.get('model') || 'modely';
const texUrl = params.get('tex') || '/wraps/modely.png';

const MODEL_URLS = {
  model3: '/wraps3d/models/Model3_High_slim.glb',
  modely: '/wraps3d/models/ModelY_High_slim.glb',
  'model3-2024-base': '/wraps3d/models/Bayberry_slim.glb',
  'modely-2025-base': '/wraps3d/models/BayberryE41_slim.glb',
  'modely-2025-premium': '/wraps3d/models/BayberryE41_slim.glb'
};
const modelUrl = MODEL_URLS[modelKey] || MODEL_URLS['modely'];

setSt('加载 ' + modelKey + ' 模型…');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(5, 8, 6); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xdde7ff, 0.8); dl2.position.set(-6, 4, -5); scene.add(dl2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);
camera.position.set(4.6, 2.2, 5.6);

// 加载贴图
const texLoader = new THREE.TextureLoader();
texLoader.load(texUrl, tex => {
  tex.flipY = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  // 加载 GLB
  new GLTFLoader().load(modelUrl, gltf => {
    const car = gltf.scene;
    const box = new THREE.Box3().setFromObject(car);
    car.position.sub(box.getCenter(new THREE.Vector3()));
    scene.add(car);
    // 贴图到 Paint 材质
    let painted = 0;
    car.traverse(o => {
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => {
        if (/^Paint/i.test(m.name)) { m.map = tex; m.color.set(0xffffff); m.needsUpdate = true; painted++; }
      });
    });
    setSt('✅ ' + modelKey + ' | 贴图面 ' + painted);
  }, undefined, e => setSt('GLB ERR: ' + (e.message || e)));
}, undefined, e => setSt('贴图加载失败: ' + (e.message || e)));
</script>
</body>
</html>
