<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 车模预览</title>
<style>
  body{margin:0;overflow:hidden;background:#0b1120;font-family:ui-monospace,monospace;}
  #st{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:14px;z-index:9;text-align:center;}
</style>
<script type="importmap">
{"imports":{"three":"/wraps3d/lib/three.module.js","three/addons/":"/wraps3d/lib/"}}
</script>
</head>
<body>
<div id="st">加载 3D 车模…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const st = document.getElementById('st');
const setSt = t => { st.textContent = t; };

// 从 URL 参数取车型
const params = new URLSearchParams(location.search);
const model = params.get('model') || 'modely';

const MODEL_URLS = {
  model3: '/wraps3d/models/Model3_High_slim.glb',
  modely: '/wraps3d/models/ModelY_High_slim.glb',
  'model3-2024-base': '/wraps3d/models/Bayberry_slim.glb',
  'model3-2024-performance': '/wraps3d/models/Bayberry_slim.glb',
  'modely-2025-base': '/wraps3d/models/BayberryE41_slim.glb',
  'modely-2025-premium': '/wraps3d/models/BayberryE41_slim.glb',
  'modely-2025-performance': '/wraps3d/models/BayberryE41_slim.glb'
};
const modelUrl = MODEL_URLS[model] || MODEL_URLS['modely'];

setSt('加载 ' + model + ' 3D 模型…');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(5, 8, 6); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xdde7ff, 0.8); dl2.position.set(-6, 4, -5); scene.add(dl2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);
camera.position.set(4.6, 2.2, 5.6);

// 从 sessionStorage 取贴图
let designTexture = null;
try {
  const texData = localStorage.getItem('ws3d_tex');
  if (texData) {
    const img = new Image();
    img.onload = function() {
      designTexture = new THREE.Texture(img);
      designTexture.flipY = true;
      designTexture.colorSpace = THREE.SRGBColorSpace;
      designTexture.needsUpdate = true;
      applyToModel();
    };
    img.src = texData;
  }
} catch(e) { console.warn('sessionStorage err', e); }

function applyToModel() {
  if (!designTexture) return;
  scene.traverse(function(o) {
    if (!o.isMesh) return;
    var ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(function(m) {
      if (/^Paint/i.test(m.name)) {
        m.map = designTexture;
        m.color.set(0xffffff);
        m.needsUpdate = true;
      }
    });
  });
}

// 加载 GLB
new GLTFLoader().load(modelUrl, function(gltf) {
  const car = gltf.scene;
  const box = new THREE.Box3().setFromObject(car);
  car.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(car);
  applyToModel();
  setSt('');
  camera.position.set(4.6, 2.2, 5.6);
  controls.target.set(0, 0.6, 0);
  controls.update();
}, undefined, function(e) {
  setSt('加载失败: ' + (e.message || e));
});

(function loop(){ requestAnimationFrame(function() { controls.update(); renderer.render(scene, camera); loop(); }); })();
</script>
</body>
</html>
