<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>m3h 3D verify</title>
<script type="importmap">
{"imports":{"three":"/wraps3d/lib/three.module.js?v=61b","three/addons/":"/wraps3d/lib/"}}
</script>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5}
  #host{position:fixed;inset:0}
  #msg{position:fixed;left:8px;top:8px;font:11px/1.5 Consolas,monospace;color:#111;z-index:9;
       background:rgba(255,255,255,.82);padding:4px 8px;white-space:pre;border-radius:6px}
</style>
</head>
<body>
<div id="host"></div>
<div id="msg">loading…</div>
<script type="module">
const msg = document.getElementById('msg');
const q = new URLSearchParams(location.search);
const key = q.get('key') || 'model3-2024-base';
const view = q.get('view') || 'fl3q';
const say = (t) => { msg.textContent = t; };
window.addEventListener('error', e => say('ERR ' + e.message));
window.addEventListener('unhandledrejection', e => say('REJ ' + (e.reason && e.reason.message || e.reason)));
try {
  const THREE = await import('three');
  const { createWrapViewer } = await import('./viewer.js?v=m3h5');
  say('viewer imported');

  /* 设计画布：漆底 + 区域标注验证（默认，?design=mcqueen 切回麦克昆） */
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
  const x = cv.getContext('2d');
  x.fillStyle = '#f8fafc'; x.fillRect(0, 0, 1024, 1024);
  const design = q.get('design') || 'regions';
  let legend = '';
  if (design === 'mcqueen') {
    const img = new Image(); img.src = '/wraps3d/models/mcqueen_t.png';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('mcqueen_t load fail')); });
    x.drawImage(img, 0, 0, 1024, 1024);
    x.strokeStyle = 'rgba(255,0,0,.22)'; x.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      x.beginPath(); x.moveTo(i * 128, 0); x.lineTo(i * 128, 1024); x.stroke();
      x.beginPath(); x.moveTo(0, i * 128); x.lineTo(1024, i * 128); x.stroke();
    }
    legend = 'design=mcqueen(128px grid)';
  } else {
    /* 区域验证：idmap(rid=R/15) → 每区一色 + 质心标编号，上 3D 逐区核对 */
    const RID_NAMES = { 2: '机盖', 3: '前保', 4: '尾门', 5: '左前门', 6: '右前门', 7: '左后门', 8: '右后门',
      9: '后保', 10: '右前翼', 11: '左前翼', 12: '右后翼', 13: '左后翼',
      14: '左ABC柱', 15: '右ABC柱', 16: '右镜', 17: '左镜' };
    const RID_COLORS = { 2: '#e6194b', 3: '#f58231', 4: '#ffe119', 5: '#3cb44b', 6: '#4363d8',
      7: '#911eb4', 8: '#42d4f4', 9: '#bfefbf', 10: '#f032e6', 11: '#469990', 12: '#9a6324',
      13: '#800000', 14: '#808000', 15: '#000075', 16: '#a9a9a9', 17: '#fabed4' };
    const im = new Image(); im.src = '/wraps3d/models/region_idmap_model3h.png?v=i5';
    await new Promise((res, rej) => { im.onload = res; im.onerror = () => rej(new Error('idmap load fail')); });
    const sc = document.createElement('canvas'); sc.width = 1024; sc.height = 1024;
    const sx = sc.getContext('2d');
    sx.drawImage(im, 0, 0, 1024, 1024);
    const idd = sx.getImageData(0, 0, 1024, 1024).data;
    const out = new ImageData(1024, 1024);
    const cent = {};
    const present = new Set();
    for (let py = 0; py < 1024; py++) {
      for (let px = 0; px < 1024; px++) {
        const o = (py * 1024 + px) * 4;
        const rid = Math.round(idd[o] / 15);
        if (rid <= 0) continue;               /* 背景=留漆色底 */
        const hex = RID_COLORS[rid] || '#b0b0b0';
        out.data[o] = parseInt(hex.slice(1, 3), 16);
        out.data[o + 1] = parseInt(hex.slice(3, 5), 16);
        out.data[o + 2] = parseInt(hex.slice(5, 7), 16);
        out.data[o + 3] = 255;
        present.add(rid);
        const c = cent[rid] || (cent[rid] = [0, 0, 0]);
        c[0] += px; c[1] += py; c[2]++;
      }
    }
    const tmp = document.createElement('canvas'); tmp.width = 1024; tmp.height = 1024;
    tmp.getContext('2d').putImageData(out, 0, 0);
    x.drawImage(tmp, 0, 0);
    x.font = 'bold 46px Consolas,monospace';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (const rk of Object.keys(cent)) {
      const c = cent[rk];
      x.lineWidth = 7; x.strokeStyle = '#000';
      x.strokeText(rk, c[0] / c[2], c[1] / c[2]);
      x.fillStyle = '#fff';
      x.fillText(rk, c[0] / c[2], c[1] / c[2]);
    }
    legend = '分区: ' + [...present].sort((a, b) => a - b).map(r => r + '=' + (RID_NAMES[r] || '?')).join(' ');
    /* 自检：回读合成后画布上各区质心像素 */
    window.__canvasProbe = [...present].sort((a, b) => a - b).slice(0, 6).map(rk => {
      const c = cent[rk];
      const d2 = x.getImageData(Math.round(c[0] / c[2]), Math.round(c[1] / c[2]), 1, 1).data;
      return rk + ':rgb(' + d2[0] + ',' + d2[1] + ',' + d2[2] + ')';
    });
  }

  const viewer = createWrapViewer(document.getElementById('host'));
  viewer.setBg(false);
  say('opening ' + key + ' …');
  const entry = await viewer.open(key, cv.toDataURL('image/png'));
  say('model loaded, framing…');

  /* 轮子诊断开关：ds=双面（验绕向） rot=轮网格转180°（验朝向） */
  const dbg = q.get('dbg') || '';
  if (entry.mode === 'official') {
    const YPI = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
    viewer.scene.traverse(o => {
      const n = o.name || '';
      if (dbg.includes('rot') && (n === 'WheelPinwheel' || n.startsWith('WheelPinwheel_'))) {
        o.quaternion.premultiply(YPI);
      }
      if (!o.isMesh) return;
      if (dbg.includes('ds') && (n.startsWith('WheelPinwheel') || n.startsWith('Wheel_') || n.startsWith('Brake'))) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.side = THREE.DoubleSide; });
      }
    });
  }

  /* 机位：Poppyseed 车长沿 X，前 = +X，左 = -Z */
  const { camera, controls } = viewer;
  const dist = camera.position.length();
  const DIRS = {
    fl3q: [4.4, 1.9, -3.2], fr3q: [4.4, 1.9, 3.2],
    rl3q: [-4.4, 1.9, -3.2], rr3q: [-4.4, 1.9, 3.2],
    sideL: [0, 1.2, -6], sideR: [0, 1.2, 6],
    front: [6, 1.3, 0], rear: [-6, 1.3, 0], top: [0.02, 8, 0.02]
  };
  if (view === 'wheel') {
    controls.target.set(1.5, 0.4, -0.73);
    camera.position.set(2.7, 1.0, -2.4);
    camera.lookAt(controls.target);
    controls.update();
  } else if (view === 'wheelR') {
    controls.target.set(1.5, 0.4, 0.73);
    camera.position.set(2.7, 1.0, 2.4);
    camera.lookAt(controls.target);
    controls.update();
  } else if (view === 'wheelLside') {
    controls.target.set(1.5, 0.4, -0.73);
    camera.position.set(1.5, 0.45, -3.6);
    camera.lookAt(controls.target);
    controls.update();
  } else if (view === 'wheelRside') {
    controls.target.set(1.5, 0.4, 0.73);
    camera.position.set(1.5, 0.45, 3.6);
    camera.lookAt(controls.target);
    controls.update();
  } else {
    const d = new THREE.Vector3(...(DIRS[view] || DIRS.fl3q)).normalize().multiplyScalar(dist * 0.95);
    camera.position.copy(controls.target).add(d);
    controls.update();
  }

  /* 断言：网格可见性 + 射线（车底封底/侧围命中） */
  const lines = ['key=' + key + ' view=' + view + ' mode=' + entry.mode];
  lines.push(legend);
  if (window.__canvasProbe) lines.push('canvas-probe ' + window.__canvasProbe.join(' '));
  let wheel = 0, brake = 0, visibleMesh = 0;
  const names = {};
  viewer.scene.traverse(o => {
    if (!o.isMesh) return;
    if (!o.visible) return;
    visibleMesh++;
    const n = o.name || '?';
    names[n] = (names[n] || 0) + 1;
    if (n.startsWith('Wheel')) wheel++;
    if (n.startsWith('Brake')) brake++;
  });
  lines.push('visibleMesh=' + visibleMesh + ' wheel=' + wheel + ' brake=' + brake);
  const mustHide = ['Floor', 'Headlights_Projections', 'Stoplights_Projection', 'Plate_US',
    'Bumper_F_Perf', 'Bumper_R_Perf', 'RHD'];
  const bad = mustHide.filter(nm => Object.keys(names).some(k => k.startsWith(nm)));
  lines.push('hidden-check: ' + (bad.length ? 'FAIL ' + bad.join(',') : 'OK'));
  const rc = new THREE.Raycaster();
  function hitFrom(origin, dir) {
    rc.set(new THREE.Vector3(...origin), new THREE.Vector3(...dir).normalize());
    const h = rc.intersectObjects(viewer.scene.children, true).filter(i => i.object.visible);
    return h.length ? h[0].object.name + '@' + h[0].distance.toFixed(2) : 'MISS';
  }
  lines.push('up-from-below: ' + hitFrom([0, -0.5, 0], [0, 1, 0]));
  lines.push('side-into-L: ' + hitFrom([0, 0.7, -3], [0, 0, 1]));
  lines.push('top-down: ' + hitFrom([0, 4, 0], [0, -1, 0]));
  /* 轮辋面朝向：从车外侧沿轴向向内打，前三命中（WheelPinwheel_0=辐面朝外）+ 节点世界位置 */
  const wp = [];
  viewer.scene.traverse(o => {
    if (o.name === 'Wheel_FL' || o.name === 'WheelPinwheel') {
      const p = new THREE.Vector3();
      o.getWorldPosition(p);
      wp.push(o.name + '@[' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ',' + p.z.toFixed(2) + ']');
    }
  });
  lines.push('nodes: ' + wp.join(' | '));
  /* 探针：Body 各 prim 的可见性与材质名（查 Fade 隐藏是否生效） */
  const bp = [];
  viewer.scene.traverse(o => {
    if (!o.isMesh) return;
    const n = o.name || '';
    if (/^Body_\d$/.test(n) || n === 'Bumper_R_Perf_Reflector') {
      const mm = (Array.isArray(o.material) ? o.material[0] : o.material) || {};
      bp.push(n + '=' + (o.visible ? 'V' : 'H') + '/' + (mm.name || '?'));
    }
  });
  lines.push('probe: ' + bp.join(' '));
  /* 车顶探针：Windows_Top 各 prim 可见性/材质 + 顶视全部命中 */
  const wt = [];
  viewer.scene.traverse(o => {
    if (!o.isMesh) return;
    const n = o.name || '';
    if (n.startsWith('Windows_Top')) {
      const mm = (Array.isArray(o.material) ? o.material[0] : o.material) || {};
      wt.push(n.replace('Windows_Top', 'WT') + '=' + (o.visible ? 'V' : 'H') + '/' + (mm.name || '?') +
              '/op' + (mm.opacity !== undefined ? mm.opacity.toFixed(2) : '-'));
    }
  });
  lines.push('rooftop: ' + wt.join(' '));
  /* Windows_Top 各 prim 世界包围盒（找真正盖车顶的片） */
  const bx = new THREE.Box3();
  const wbp = [];
  viewer.scene.traverse(o => {
    if (!o.isMesh) return;
    const n = o.name || '';
    if (n.startsWith('Windows_Top')) {
      o.updateMatrixWorld(true);
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      bx.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
      wbp.push(n.replace('Windows_Top', 'WT') + (o.visible ? 'V' : 'H') +
        '@x[' + bx.min.x.toFixed(2) + ',' + bx.max.x.toFixed(2) + ']' +
        'y[' + bx.min.y.toFixed(2) + ',' + bx.max.y.toFixed(2) + ']' +
        'z[' + bx.min.z.toFixed(2) + ',' + bx.max.z.toFixed(2) + ']');
    }
  });
  lines.push('wt-bbox: ' + wbp.join(' '));
  /* 车顶多点射线 */
  for (const px of [0, 0.5, -0.5]) {
    rc.set(new THREE.Vector3(px, 3, 0), new THREE.Vector3(0, -1, 0));
    const h = rc.intersectObjects(viewer.scene.children, true).filter(i => i.object.visible).slice(0, 2);
    lines.push('roof-ray@x' + px + ': ' + (h.length ? h.map(i => i.object.name + '@' + i.distance.toFixed(2)).join('|') : 'MISS'));
  }
  for (const [nm, wz, dir] of [['FL', -0.73, 1], ['FR', 0.73, -1]]) {
    rc.set(new THREE.Vector3(1.5, 0.42, wz - dir * 2.0), new THREE.Vector3(0, 0, dir));
    const h = rc.intersectObjects(viewer.scene.children, true).filter(i => i.object.visible).slice(0, 4);
    lines.push('axle-' + nm + ': ' + (h.length ? h.map(i => i.object.name + '@' + i.distance.toFixed(2)).join(' | ') : 'MISS'));
  }
  say(lines.join('\n'));
  window.__ready = true;
} catch (e) {
  say('ERR ' + (e && e.message || e));
}
</script>
</body>
</html>
