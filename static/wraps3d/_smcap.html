<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StopMo Capture — six cars (sandbox only, NOT in FILE_LIST)</title>
<script type="importmap">
{"imports":{"three":"/wraps3d/lib/three.module.js?v=uv2","three/addons/":"/wraps3d/lib/"}}
</script>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #c{width:1080px;height:1080px;display:block}
  #hud{position:fixed;left:8px;top:8px;color:#9aa;font-size:12px;white-space:pre-line;z-index:9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<div id="hud">loading…</div>
<script>
window.addEventListener('error', function(e){
  document.getElementById('hud').textContent = 'LOAD-ERR: ' + (e.message || e.filename || 'unknown');
});
window.addEventListener('unhandledrejection', function(e){
  document.getElementById('hud').textContent = 'REJ: ' + (e.reason && e.reason.message || e.reason);
});
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ==== uvcars.html 的六车配置原样搬运（2026-10-03 最新版）==== */
const DEGEN_POINTS = { model3: [[0.9629, -0.8376], [0.0, 1.0], [0.0, 1.0], [-0.7109, -0.543], [0.2114, 0.8066], [0.7969, 0.397], [-0.1091, -0.2084], [0.7939, 0.8052], [0.5142, 0.176], [0.8511, -0.5743], [-0.2681, 0.5713], [0.7319, 0.189]] };
const MODELS = {
  modely: {
    label: '老款 Model Y',
    glb: '/wraps3d/models/ModelY_High_ofuv5_slim.glb?v=ofuv5s1',
    extTex: '/wraps3d/models/tex/Exterior_BC_Y_High.png?v=ofuv5',
    lampTex: '/wraps3d/models/tex/Lights_BC_Y_High.png?v=ofuv5',
    defaultTex: '/wraps3d/models/modely.png',
    primClass: {
    'Body': {0:"ext",1:"wrap",2:"ext",3:"ext",4:"rough"},
    'Door_LF': {0:"ext",1:"wrap",2:"rough"},
    'Door_LF_Mirror': {0:"ext",1:"wrap"},
    'Door_LR': {0:"ext",1:"wrap",2:"rough"},
    'Door_RF': {0:"ext",1:"wrap",2:"rough"},
    'Door_RF_Mirror': {0:"ext",1:"wrap"},
    'Door_RR': {0:"ext",1:"wrap",2:"rough"},
    'Hood': {0:"wrap",1:"ext"},
    'Trunk': {0:"ext",1:"ext",2:"wrap",3:"ext",4:"rough"}
  },
    hideMeshes: [],
  },
  model3: {
    label: '老款 Model 3',
    glb: '/wraps3d/models/Model3_High_cars_slim.glb?v=slim3',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/model3.png',
    hideMeshes: [],
    primClass: {
    'Body': {0:"ext",1:"wrap",3:"rough"},
    'Charge_Cap': {1:"ext"},
    'Door_LF': {0:"wrap",1:"ext",2:"rough"},
    'Door_LF_Mirror': {0:"wrap",1:"ext"},
    'Door_LR': {0:"ext",1:"wrap",2:"rough"},
    'Door_RF': {0:"wrap",1:"ext",2:"rough"},
    'Door_RF_Mirror': {0:"wrap",1:"ext"},
    'Door_RR': {0:"ext",1:"wrap",2:"rough"},
    'Hood': {0:"ext",1:"wrap"},
    'Lights_Glass': {1:"ext"},
    'Trunk': {0:"ext",1:"wrap"},
    'Trunk_Bracket1': {0:"wrap",1:"ext"},
    'Trunk_Bracket2': {0:"wrap",1:"ext"}
  },
  },
  model3h: {
    label: '新款 Model 3',
    glb: '/wraps3d/models/Poppyseed_cars_slim.glb?v=pps1',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/model3_2024_base.png',
    hideMeshes: ['Bumper_F_Perf', 'Bumper_R_Perf', 'Spoiler', 'Fade'],
  },
  model3p: {
    label: '新款 3P',
    glb: '/wraps3d/models/Poppyseed_cars_slim.glb?v=pps1',
    wheelGlb: '/wraps3d/models/Wheel_Wishbone20.glb?v=wb1',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/model3_2024_performance.png',
    hideMeshes: ['Bumper_F_Base', 'Bumper_R_Base', 'Fade', 'WheelCar'],
  },
  modely25: {
    label: '新款 Model Y 基础版车身',
    hidden: true,
    glb: '/wraps3d/models/BayberryE41_cars.glb?v=b8',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/modely_2025_base.png',
    hideMeshes: ['HighBeam_Left', 'HighBeam_Right'],
    primClass: {
      'Static_Exterior': {2: "cvrB", 5: "clad", 10: "tailLamp", 11: "tailLamp"},
      'Hood': {1: "cvrB", 3: "clad"},
      'Front_Left_Door': {2: "cvrB", 5: "clad"},
      'Front_Right_Door': {2: "cvrB", 5: "clad"},
      'Back_Left_Door': {2: "cvrB", 5: "clad"},
      'Back_Right_Door': {2: "cvrB", 5: "clad"},
      'Trunk_Cover_Main': {4: "clad"},
      'DRL_Left': {0: "lamp", 2: "hide"},
      'DRL_Right': {0: "lamp", 2: "hide"}
    },
    wheelY: 0, wheelIn: 0, tireR: 0.335, groundY: 0,
  },
  modelyl: {
    label: 'Model Y L',
    glb: '/wraps3d/models/BayberryE80_cars_slim.glb?v=y8s1r',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/modely_l.png',
    hideMeshes: [],
  },
  modely25b: {
    label: '新款 Model Y',
    glb: '/wraps3d/models/Bayberry2_cars_slim.glb?v=bbs1',
    extTex: null,
    lampTex: null,
    defaultTex: '/wraps3d/models/modely_2025_performance.png',
    hideMeshes: ['Fascia_Perf', 'Spoiler_Perf', 'Seats_Perf', 'DRL', 'Headlights_On',
      'Fog_Light_On', 'Parking_Lights_On', 'Brake_Lights_On', 'Left_Turn_Signal_On',
      'Right_Turn_Signal_On', 'Back_Left_Turn_Signal_On', 'Back_Right_Turn_Signal_On',
      'Parking_Light_Projection', 'Headlights_Beam', 'LeftGlow', 'RightGlow', 'HorizontalGlow',
      'Tesla_Badge', 'Plate_US', 'Plate_EU', 'RHD', 'Doorcard_LF_RHD', 'Doorcard_RF_RHD',
      'Skullcap_LF_SierraBlack', 'Skullcap_RF_SierraBlack', 'Defrost_Front', 'Defrost_Rear',
      'BrakeLightProjection', 'HeadLightProjection', 'Reverse Light On'],
    official: ['BrakeLightProjection', 'HeadLightProjection', 'Tesla_Badge', 'Plate_US', 'Plate_EU',
      'DRL', 'Headlights_On', 'Fog_Light_On', 'Parking_Lights_On', 'Parking_Light_Projection',
      'Brake_Lights_On', 'Left_Turn_Signal_On', 'Right_Turn_Signal_On',
      'Back_Left_Turn_Signal_On', 'Back_Right_Turn_Signal_On',
      'LeftGlow', 'RightGlow', 'HorizontalGlow', 'Headlights_Beam',
      'RHD', 'Doorcard_LF_RHD', 'Doorcard_RF_RHD',
      'Skullcap_LF_SierraBlack', 'Skullcap_RF_SierraBlack',
      'Defrost_Front', 'Defrost_Rear', 'Spoiler_Perf', 'Fascia_Perf', 'Seats_Perf'],
    wheelY: 0, wheelIn: 0, tireR: 0.335, groundY: 0,
  },
};
const params = new URLSearchParams(location.search);
const MODEL_ID = params.get('m') || 'modely25b';
const CFG = MODELS[MODEL_ID] || MODELS.modely25b;

const hud = document.getElementById('hud');
const canvas = document.getElementById('c');
const SZ = 1080;

/* ==== _promo.html 的影棚配方：alpha 透明底 + 同步 render，无 RAF 依赖 ==== */
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true, alpha:true});
renderer.setPixelRatio(1);
renderer.setSize(SZ, SZ, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = null;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2f3c, 1.0));
const hemi = scene.children[scene.children.length - 1];
const dir = new THREE.DirectionalLight(0xffffff, 1.9);
dir.position.set(5, 8, 4);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xdfe8ff, 0.7);
dir2.position.set(-6, 4, -5);
scene.add(dir2);
const rim = new THREE.DirectionalLight(0xbfd4ff, 1.1);
rim.position.set(0, 2.2, -8);
scene.add(rim);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x05070c);
const _strip = (w, h, c, x, y, z, rx, ry) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({color: c, side: THREE.DoubleSide}));
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); envScene.add(m);
};
_strip(7, 2.2, 0xffffff, 0, 3.2, 0, Math.PI / 2, 0);
_strip(9, 1.6, 0xf4f8ff, 0, 1.6, -5.5, 0, 0);
_strip(9, 1.2, 0x232833, 0, 1.0, 5.5, 0, Math.PI);
_strip(2, 1.6, 0xffffff, -4.5, 1.8, 0, 0, Math.PI / 2);
_strip(2, 1.6, 0xffffff, 4.5, 1.8, 0, 0, -Math.PI / 2);
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const TARGET = new THREE.Vector3(0, 0.75, 0);

/* ==== 材质与接线：与 uvcars.html 完全一致 ==== */
const wrapMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.38, metalness: 0.05, side: THREE.DoubleSide});
const extShellMat = new THREE.MeshStandardMaterial({color: 0x0a0a0c, roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide});
const roughPaintMat = new THREE.MeshStandardMaterial({color: 0x0a0a0c, roughness: 0.62, metalness: 0.0, side: THREE.DoubleSide});
const glassMat = new THREE.MeshStandardMaterial({color: 0x080b10, transparent: true, opacity: 0.78,
  roughness: 0.05, metalness: 0.25, side: THREE.DoubleSide});
glassMat.envMapIntensity = 0;
const lensMat = new THREE.MeshStandardMaterial({color: 0xc9d2d9, roughness: 0.3, metalness: 0.15,
  transparent: true, opacity: 0.92, side: THREE.DoubleSide});
lensMat.envMapIntensity = 0.15;
const lampMat = new THREE.MeshStandardMaterial({color: 0x3a4046, roughness: 0.25, metalness: 0.3});
if (CFG.lampTex){
  const lt = new THREE.TextureLoader().load(CFG.lampTex);
  lt.flipY = false; lt.colorSpace = THREE.SRGBColorSpace;
  lampMat.map = lt; lampMat.emissiveMap = lt;
  lampMat.emissive = new THREE.Color(0x666666); lampMat.emissiveIntensity = 0.35;
  lampMat.needsUpdate = true;
}
const interiorMat = new THREE.MeshStandardMaterial({color: 0x232529, roughness: 0.85, side: THREE.DoubleSide});
const tireMat = new THREE.MeshStandardMaterial({color: 0x0a0a0b, roughness: 0.92, side: THREE.DoubleSide});
const rimMat = new THREE.MeshStandardMaterial({color: 0x363a41, roughness: 0.42, metalness: 0.6, side: THREE.DoubleSide});
const rotorMat = new THREE.MeshStandardMaterial({color: 0x8f9398, roughness: 0.45, metalness: 0.8, side: THREE.DoubleSide});
const caliperMat = new THREE.MeshStandardMaterial({color: 0xd8dbde, roughness: 0.4, metalness: 0.3, side: THREE.DoubleSide});
const plateMat = new THREE.MeshStandardMaterial({color: 0xd8dadb, roughness: 0.5, side: THREE.DoubleSide});
const underMat = new THREE.MeshStandardMaterial({color: 0x131418, roughness: 0.9, side: THREE.DoubleSide});
const cladMat = new THREE.MeshStandardMaterial({color: 0x000919, roughness: 0.55, side: THREE.DoubleSide});
const tailLampMat = new THREE.MeshStandardMaterial({color: 0x2a0e0a, roughness: 0.28, metalness: 0.15, side: THREE.DoubleSide});
const cvrBMat = new THREE.MeshStandardMaterial({color: 0x060606, roughness: 0.3, side: THREE.DoubleSide});

function matClass(mn){
  if (mn === 'Paint' || mn === 'PaintFade' || mn === 'Paint2') return 'wrap';
  if (mn === 'Exterior' || mn === 'ExteriorFade' || mn === 'Exterior_Perf') return 'ext';
  if (mn === 'PaintRough' || mn === 'Paint_Rough_Perf') return 'rough';
  if (mn === 'TireDark') return 'tire';
  if (mn === 'RimSilver') return 'rim';
  if (mn === 'RotorSteel') return 'rotor';
  if (mn === 'CaliperPaint') return 'caliper';
  if (mn === 'UnderbodyDark') return 'under';
  if (/^Glass|MirrorFade/.test(mn)) return 'glass';
  if (mn === 'standardSurface2' || mn === 'aistandardsuface') return 'lens';
  if (mn === 'Light_Off') return 'lamp';
  if (/^(Light|Light_Global|LightsFade|Illumination|Fog_Cover|Chargeport|Grille|Reflector|GlossyBlack|DRL_)/.test(mn)) return 'lamp';
  if (/Projection$/.test(mn) || mn === 'Ground_Plane' || mn === 'GroundPlane' || mn === 'Beam') return 'hide';
  if (mn === 'Plates') return 'plate';
  if (mn === 'Spoiler' || mn === 'Cover' || mn === 'Cover_Fade') return 'paint';
  return 'interior';
}
const MATS = {wrap: wrapMat, ext: extShellMat, rough: roughPaintMat, glass: glassMat,
  lamp: lampMat, lens: lensMat, interior: interiorMat, tire: tireMat, rim: rimMat, rotor: rotorMat,
  caliper: caliperMat, plate: plateMat, under: underMat, clad: cladMat, cvrB: cvrBMat,
  tailLamp: tailLampMat, paint: extShellMat, hide: null};

const HIDE_MESH = new Set(['Floor', 'Headlights_Projections', 'Taillights_Projection', 'Stoplights_Projection']);

const composeCv = document.createElement('canvas');
composeCv.width = 1024; composeCv.height = 1024;
const composeCx = composeCv.getContext('2d');
let paintHex = '#f8fafc';
let templateImg = null;
let liveTex = null;
let wrapTargets = [];

function paintNeutralDisks(){
  if (!CFG.degenPoints) return;
  composeCx.fillStyle = paintHex;
  for (const p of CFG.degenPoints){
    composeCx.beginPath();
    composeCx.arc(p[0] * 1024, p[1] * 1024, 6, 0, Math.PI * 2);
    composeCx.fill();
  }
}
function applyLive(){
  if (!liveTex){
    liveTex = new THREE.CanvasTexture(composeCv);
    liveTex.flipY = false;
    liveTex.colorSpace = THREE.SRGBColorSpace;
    liveTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  liveTex.channel = 1;
  liveTex.needsUpdate = true;
  for (const o of wrapTargets){
    o.material.map = liveTex; o.material.color.set(0xffffff);
    o.material.roughness = 0.38; o.material.metalness = 0.05; o.material.needsUpdate = true;
  }
}
function loadImg(src){
  const finalSrc = src.startsWith("data:") ? src : src + (src.includes("?") ? "&" : "?") + "v=" + Date.now();
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = (e) => reject(new Error("img fail " + src.slice(0, 60)));
    im.src = finalSrc;
  });
}

async function setPaint(hexOrObj){
  if (typeof hexOrObj === 'object' && hexOrObj.wrap){
    const img = await loadImg(hexOrObj.wrap);
    composeCx.fillStyle = '#f8fafc';
    composeCx.fillRect(0, 0, 1024, 1024);
    composeCx.drawImage(img, 0, 0, 1024, 1024);
    applyLive();
    return 'wrap';
  }
  let fillStyle = '#f8fafc';
  if (typeof hexOrObj === 'object' && hexOrObj.g){
    paintHex = 'gradient:' + hexOrObj.g.join('-');
    const [c1, c2] = hexOrObj.g;
    const deg = ((hexOrObj.deg === undefined ? 135 : hexOrObj.deg) * Math.PI) / 180;
    const x2 = Math.cos(deg) * 1024, y2 = Math.sin(deg) * 1024;
    const gr = composeCx.createLinearGradient(0, 0, x2, y2);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    fillStyle = gr;
  } else {
    paintHex = (typeof hexOrObj === 'string' ? hexOrObj : '#f8fafc');
    fillStyle = paintHex;
  }
  if (!templateImg) templateImg = await loadImg(CFG.defaultTex);
  composeCx.fillStyle = fillStyle;
  composeCx.fillRect(0, 0, 1024, 1024);
  composeCx.globalCompositeOperation = 'multiply';
  composeCx.drawImage(templateImg, 0, 0, 1024, 1024);
  composeCx.globalCompositeOperation = 'source-over';
  paintNeutralDisks();
  applyLive();
  return paintHex;
}

let loadErr = null;
new GLTFLoader().load(CFG.glb, (gltf) => {
  try {
    const model = gltf.scene;
    model.scale.setScalar(0.95);   // 与 uvcars 最新默认一致
    window.__model = model;
    const assoc = gltf.parser.associations;
    const jmeshes = gltf.parser.json.meshes;
    const jnames = jmeshes.map(m => (m && m.name) || '');
    const globalHide = new Set(jnames.filter(nm => nm.endsWith('_GLOBAL') && jnames.includes(nm.slice(0, -7))));
    const counters = {};
    model.traverse(o => {
      if (!o.isMesh) return;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      const a = assoc.get(o) || {};
      const mi = a.meshes;
      if (mi === undefined) return;
      const base = jnames[mi] || ('mesh' + mi);
      const pidx = a.primitives || 0;
      const gmat = jmeshes[mi].primitives[pidx] && jmeshes[mi].primitives[pidx].material;
      const matName = (gmat !== undefined && gltf.parser.json.materials[gmat]) ? gltf.parser.json.materials[gmat].name || '?' : '?';
      if ((HIDE_MESH.has(base) || globalHide.has(base) || (CFG.hideMeshes || []).includes(base))){
        o.visible = false; return;
      }
      var cls = null;
      if (CFG.official){
        if (CFG.official.includes(base)){ o.visible = false; counters.officialHide = (counters.officialHide || 0) + 1; return; }
        cls = matClass(matName);
        if (cls === 'hide'){ o.visible = false; return; }
        if (cls === 'wrap'){ wrapTargets.push(o); counters.wrap = (counters.wrap || 0) + 1; return; }
        if (cls === 'glass' || cls === 'tire' || cls === 'rim'){ o.material = MATS[cls]; return; }
        return;
      }
      var pc = CFG.primClass && CFG.primClass[base];
      if (pc) cls = pc[pidx];
      if (!cls) cls = matClass(matName);
      counters[cls] = (counters[cls] || 0) + 1;
      if (cls === 'hide'){ o.visible = false; return; }
      o.material = MATS[cls] || interiorMat;
      if (cls === 'wrap') wrapTargets.push(o);
    });
    if (CFG.wheelY || CFG.wheelIn){
      model.traverse(o => {
        if (!o.isMesh) return;
        let p = o, nm = '';
        for (let d = 0; d < 4 && p; d++){ if (/^Wheel_(FL|FR|RL|RR)$/.test(p.name)) { nm = p.name; break; } p = p.parent; }
        if (!nm) return;
        var T2 = THREE;
        var wpv = new T2.Vector3(); p.getWorldPosition(wpv);
        var sign = wpv.x >= 0 ? 1 : -1;
        var targetX = sign * (Math.abs(wpv.x) - (CFG.wheelIn || 0));
        var targetY = (CFG.tireR || 0.335) + (CFG.groundY || 0);
        p.position.x += targetX - wpv.x;
        p.position.y += targetY - wpv.y;
      });
    }
    if (CFG.groundY) model.position.y += CFG.groundY;
    scene.add(model);
    window.__wrapTargets = wrapTargets;
    if (CFG.wheelGlb){
      const mounts = CFG.wheelMounts || [
        [1.5, 0.332, -0.725, Math.PI], [1.5, 0.332, 0.725, 0],
        [-1.375, 0.332, -0.73, Math.PI], [-1.375, 0.332, 0.73, 0]];
      new GLTFLoader().load(CFG.wheelGlb, (wg) => {
        const proto = wg.scene;
        for (const [x, y, z, ry] of mounts){
          const w = proto.clone();
          w.position.set(x, y, z);
          w.rotation.y = ry;
          w.traverse(c => {
            if (!c.isMesh) return;
            const mn = (Array.isArray(c.material) ? c.material[0].name : c.material.name) || '';
            if (/tire/i.test(mn)) c.material = tireMat;
            else c.material = rimMat;
          });
          model.add(w);
        }
        window.__wheels = true;
      }, undefined, (e) => { loadErr = '轮GLB加载失败: ' + e; });
    }
    setPaint(params.get('paint') || '#f8fafc').then(() => {
      window.__promoReady = { car: MODEL_ID, counters, wrapTargets: wrapTargets.length, wheels: !!CFG.wheelGlb };
      hud.textContent = 'ready [' + MODEL_ID + '] wrap=' + wrapTargets.length;
      if (window.__promoWaitReady){ const f = window.__promoWaitReady; window.__promoWaitReady = null; f(); }
    });
  } catch (e) {
    loadErr = 'wiring: ' + (e && e.message);
    hud.textContent = 'LOAD-ERR ' + loadErr;
  }
}, (ev) => {
  hud.textContent = ev.total ? 'loading ' + Math.round(ev.loaded / ev.total * 100) + '%' : 'loading…';
}, (e) => {
  loadErr = 'GLB-ERR: ' + (e && e.message || 'unknown');
  hud.textContent = loadErr;
});

function setCam(cfg){
  const az = (cfg.az * Math.PI) / 180;
  const pol = (cfg.pol * Math.PI) / 180;
  const sph = new THREE.Spherical(cfg.r === undefined ? 7.0 : cfg.r, pol, az);
  camera.position.setFromSpherical(sph);
  const t = cfg.t || [0, 0.75, 0];
  TARGET.set(t[0], t[1], t[2]);
  camera.position.add(TARGET);
  camera.lookAt(TARGET);
}
function grab(png){
  return canvas.toDataURL(png ? 'image/png' : 'image/jpeg', png ? undefined : 0.95);
}

window.__promo = {
  async ready(){
    if (window.__promoReady) return window.__promoReady;
    return await new Promise((res) => { window.__promoWaitReady = () => res(window.__promoReady); });
  },
  setPaint,
  async snapBatch(list){
    const out = [];
    for (const it of list){
      if (it.paint !== undefined || it.wrap){ await setPaint(it.paint !== undefined ? it.paint : it); }
      setCam(it);
      renderer.render(scene, camera);
      out.push(grab(it.png));
    }
    return out;
  },
  status(){
    return { ready: !!window.__promoReady, info: window.__promoReady || null, err: loadErr };
  },
};
</script>
</body>
</html>
