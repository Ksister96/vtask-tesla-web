  8:'#b5e661',9:'#8c8ce6',10:'#ffa050',11:'#e6e66e',12:'#6ee6aa',13:'#e6966e',
  14:'#9696ff',15:'#c86eb4',16:'#8cd28c',17:'#ff7878'};

function composeTry(){
  if (!idData) return;
  composeCx.fillStyle = paintHex;
  composeCx.fillRect(0, 0, 1024, 1024);
  const im = composeCx.getImageData(0, 0, 1024, 1024);
  const d = im.data, s = idData.data;
  for (let i = 0; i < 1024 * 1024; i++){
    const rid = Math.round(s[i * 4] / CFG.idmap.div);
    if (rid >= 1 && activeRegions.has(rid)){
      const c = RCOLOR[rid] || '#ff00ff';
      d[i*4] = parseInt(c.slice(1,3),16); d[i*4+1] = parseInt(c.slice(3,5),16);
      d[i*4+2] = parseInt(c.slice(5,7),16); d[i*4+3] = 255;
    }
  }
  composeCx.putImageData(im, 0, 0);
}
function paintNeutralDisks(){
  if (!CFG.degenPoints) return;
  composeCx.fillStyle = paintHex;
  for (const p of CFG.degenPoints){
    composeCx.beginPath();
    composeCx.arc(p[0] * 1024, p[1] * 1024, 6, 0, Math.PI * 2);
    composeCx.fill();
  }
}
function composeDesign(imgEl){
  composeCx.fillStyle = paintHex;
  composeCx.fillRect(0, 0, 1024, 1024);
  composeCx.drawImage(imgEl, 0, 0, 1024, 1024);
  paintNeutralDisks();
}

const interiorMat = new THREE.MeshStandardMaterial({color: 0x232529, roughness: 0.85, side: THREE.DoubleSide});
const tireMat = new THREE.MeshStandardMaterial({color: 0x0a0a0b, roughness: 0.92, side: THREE.DoubleSide});
const rimMat = new THREE.MeshStandardMaterial({color: 0x363a41, roughness: 0.42, metalness: 0.6, side: THREE.DoubleSide});
const rotorMat = new THREE.MeshStandardMaterial({color: 0x8f9398, roughness: 0.45, metalness: 0.8, side: THREE.DoubleSide});
const caliperMat = new THREE.MeshStandardMaterial({color: 0xd8dbde, roughness: 0.4, metalness: 0.3, side: THREE.DoubleSide});
const plateMat = new THREE.MeshStandardMaterial({color: 0xd8dadb, roughness: 0.5, side: THREE.DoubleSide});
const underMat = new THREE.MeshStandardMaterial({color: 0x131418, roughness: 0.9, side: THREE.DoubleSide});
const cladMat = new THREE.MeshStandardMaterial({color: 0x000919, roughness: 0.55, side: THREE.DoubleSide});
const tailLampMat = new THREE.MeshStandardMaterial({color: 0x2a0e0a, roughness: 0.28, metalness: 0.15, side: THREE.DoubleSide});
const cvrBMat = new THREE.MeshStandardMaterial({color: 0x060606, roughness: 0.3, side: THREE.DoubleSide});

// material-name -> class
function matClass(mn){
  if (mn === 'Paint' || mn === 'PaintFade' || mn === 'Paint2') return 'wrap';
  if (mn === 'Exterior' || mn === 'ExteriorFade' || mn === 'Exterior_Perf') return 'ext';
  if (mn === 'PaintRough' || mn === 'Paint_Rough_Perf') return 'rough';
  if (mn === 'TireDark') return 'tire';
  if (mn === 'RimSilver') return 'rim';
  if (mn === 'RotorSteel') return 'rotor';
  if (mn === 'CaliperPaint') return 'caliper';
  if (mn === 'UnderbodyDark') return 'under';
  if (/^Glass|MirrorFade/.test(mn)) return 'glass';
  if (mn === 'standardSurface2' || mn === 'aistandardsuface') return 'lens';
  if (mn === 'Light_Off') return 'lamp';
  if (/^(Light|Light_Global|LightsFade|Illumination|Fog_Cover|Chargeport|Grille|Reflector|GlossyBlack|DRL_)/.test(mn)) return 'lamp';
  if (/Projection$/.test(mn) || mn === 'Ground_Plane' || mn === 'GroundPlane' || mn === 'Beam') return 'hide';
  if (mn === 'Plates') return 'plate';
  if (mn === 'Spoiler' || mn === 'Cover' || mn === 'Cover_Fade') return 'paint';
  return 'interior';
}
const MATS = {wrap: wrapMat, ext: extShellMat, rough: roughPaintMat, glass: glassMat,
  lamp: lampMat, lens: lensMat, interior: interiorMat, tire: tireMat, rim: rimMat, rotor: rotorMat,
  caliper: caliperMat, plate: plateMat, under: underMat, clad: cladMat, cvrB: cvrBMat,
  tailLamp: tailLampMat, paint: extShellMat, hide: null};

let wrapTargets = [];
let liveTex = null;
// ---- 换肤扫过动画（路线B：2D合成画布扫描——逐帧重绘 composeCv 并刷新同一张贴图，完全不动着色器；?fx=0 关闭）----
let fxAnim = null;          // {t0, dur, ease}
let fxLastHash = '';
let fxVisible = true;       // 池内隐藏帧直接应用不播动画
let fxOldSnap = null, fxNewSnap = null;
function fxHash(s){ if (!s) return ''; return 'h' + s.length + '_' + s.charCodeAt(0) + '_' + s.charCodeAt(s.length >> 1) + '_' + s.charCodeAt(s.length - 1); }
function fxClone(c){ const n = document.createElement('canvas'); n.width = c.width; n.height = c.height; n.getContext('2d').drawImage(c, 0, 0); return n; }
function fxBegin(){
  fxAnim = { t0: performance.now(), dur: 1100, ease: function(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; } };
  window.__fx = { prog: 0, plays: ((window.__fx && window.__fx.plays) || 0) + 1 };
}
// 扫过方向：0=画布左→右 1=右→左 2=上→下 3=下→上。默认 2（上→下）＝主驾→副驾（2026-10-04 用户实选定）
function fxGetMode(){
  try { const v = sessionStorage.getItem('fx_mode'); return (v === null || v === '') ? 2 : (+v || 0) % 4; } catch(e){ return 2; }
}
window.__fxSetMode = function(m){
  try { sessionStorage.setItem('fx_mode', String(((+m || 0) % 4 + 4) % 4)); } catch(e){}
  return fxGetMode();
};
function fxTick(){
  if (!fxAnim || !fxOldSnap || !fxNewSnap || !liveTex) return;
  const p = Math.min(1, (performance.now() - fxAnim.t0) / fxAnim.dur);
  const e = fxAnim.ease(p);
  const mode = fxGetMode();
  const ctx = composeCv.getContext('2d');
  const w = composeCv.width, h = composeCv.height;
  ctx.drawImage(fxNewSnap, 0, 0);
  if (e < 1){
    ctx.save();
    ctx.beginPath();
    if (mode === 0) ctx.rect(Math.round(w * e), 0, w, h);          // 新皮在左，旧皮在右
    else if (mode === 1) ctx.rect(0, 0, Math.round(w * (1 - e)), h); // 新皮在右，旧皮在左
    else if (mode === 2) ctx.rect(0, Math.round(h * e), w, h);      // 新皮在上，旧皮在下
    else ctx.rect(0, 0, w, Math.round(h * (1 - e)));                 // 新皮在下，旧皮在上
    ctx.clip();
    ctx.drawImage(fxOldSnap, 0, 0);
    ctx.restore();
    // 扫光带（沿分界线）
    let g;
    if (mode <= 1){
      const gx = mode === 0 ? Math.round(w * e) : Math.round(w * (1 - e));
      g = ctx.createLinearGradient(gx - 30, 0, gx + 30, 0);
    } else {
      const gy = mode === 2 ? Math.round(h * e) : Math.round(h * (1 - e));
      g = ctx.createLinearGradient(0, gy - 30, 0, gy + 30);
    }
    g.addColorStop(0, 'rgba(255,255,220,0)');
    g.addColorStop(0.5, 'rgba(255,255,220,0.5)');
    g.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = g;
    if (mode <= 1) ctx.fillRect((mode === 0 ? Math.round(w * e) : Math.round(w * (1 - e))) - 30, 0, 60, h);
    else ctx.fillRect(0, (mode === 2 ? Math.round(h * e) : Math.round(h * (1 - e))) - 30, w, 60);
  }
  liveTex.needsUpdate = true;
  if (window.__fx) window.__fx.prog = e;
  if (p >= 1){ ctx.drawImage(fxNewSnap, 0, 0); liveTex.needsUpdate = true; fxAnim = null; }
}
// 测试/演示钩子：用最近一次换皮的新旧快照重播扫过动画
window.__fxTest = function(dur){
  if (!fxOldSnap || !fxNewSnap) return 'no-snaps-yet（先换一次皮）';
  fxBegin();
  if (fxAnim) fxAnim.dur = dur || 3000;
  return 'ok';
};
// 调整正在播放的动画时长（验证/演示用；须在换肤推送后立刻调用）
window.__fxSetDur = function(ms){ if (fxAnim) fxAnim.dur = ms; return fxAnim ? 'ok' : 'no-anim'; };
// 手动泵一帧动画（后台标签 rAF 冻结时供录制脚本驱动；与 rAF 调的是同一个 fxTick）
window.__fxTick = function(){ fxTick(); return window.__fx ? +(+window.__fx.prog).toFixed(3) : 1; };
// 后台标签 rAF 冻结时手动渲染一帧（录制脚本用）
window.__fxRender = function(){ controls.update(); renderer.render(scene, camera); };
// 诊断：暴露渲染器
window.__renderer = renderer;
function applyComposed(){
  if (!liveTex){
    liveTex = new THREE.CanvasTexture(composeCv);
    liveTex.flipY = false;
    liveTex.colorSpace = THREE.SRGBColorSpace;
    liveTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  liveTex.channel = 1;
  liveTex.needsUpdate = true;
  for (const o of wrapTargets){
    o.material.map = liveTex; o.material.color.set(0xffffff);
    o.material.roughness = 0.38; o.material.metalness = 0.05; o.material.needsUpdate = true;
  }
}
function applyTexture(src){
  if (tryMode){ applyComposed(); hud.textContent = '分区试色中（点区域按钮上色）'; return; }
  curTex = src;
  const done = () => {
    for (const o of wrapTargets){
      o.material.map = liveTex || wrapMat.map;
      o.material.color.set(0xffffff);
      o.material.roughness = 0.38; o.material.metalness = 0.05; o.material.needsUpdate = true;
    }
    hud.textContent = '贴图: ' + src;
  };
  new THREE.TextureLoader().load(src + (src.includes('?') ? '&' : '?') + 'v=' + Date.now(), (img) => {
    composeDesign(img.image);
    paintNeutralDisks();
    liveTex = new THREE.CanvasTexture(composeCv);
    liveTex.flipY = false;
    liveTex.colorSpace = THREE.SRGBColorSpace;
    liveTex.channel = 1;
    liveTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    done();
  }, undefined, (e) => { hud.textContent = '贴图加载失败: ' + src; });
}

const HIDE_MESH = new Set(['Floor', 'Headlights_Projections', 'Taillights_Projection', 'Stoplights_Projection']);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);   // 2026-10-04 起车型 GLB 为 meshopt 量化压缩版（*_mo.glb）
hud.textContent = '开始加载模型…';
const t0 = performance.now();
loader.load(CFG.glb, (gltf) => {
  const model = gltf.scene;
  model.scale.setScalar(0.95);   // 默认缩小 5%（2026-10-03）
  window.__model = model;
  const assoc = gltf.parser.associations;
  const jmeshes = gltf.parser.json.meshes;
  const jnames = jmeshes.map(m => (m && m.name) || '');
  const globalHide = new Set(jnames.filter(nm => nm.endsWith('_GLOBAL') && jnames.includes(nm.slice(0, -7))));
  const counters = {};
  model.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    const a = assoc.get(o) || {};
    const mi = a.meshes;
    if (mi === undefined) return;
    const base = jnames[mi] || ('mesh' + mi);
    const pidx = a.primitives || 0;
    const gmat = jmeshes[mi].primitives[pidx] && jmeshes[mi].primitives[pidx].material;
    const matName = (gmat !== undefined && gltf.parser.json.materials[gmat]) ? gltf.parser.json.materials[gmat].name || '?' : '?';
    if ((HIDE_MESH.has(base) || globalHide.has(base) || (CFG.hideMeshes || []).includes(base))){
      o.visible = false; return;
    }
    var cls = null;
    if (CFG.official){
      // 官方素材复刻：保留 GLB 内嵌官方材质；玻璃强制深色、轮胎强制不透明黑
      if (CFG.official.includes(base)){ o.visible = false; counters.officialHide = (counters.officialHide || 0) + 1; return; }
      cls = matClass(matName);
      if (cls === 'hide'){ o.visible = false; return; }
      if (cls === 'wrap'){ wrapTargets.push(o); counters.wrap = (counters.wrap || 0) + 1; return; }
      if (cls === 'glass' || cls === 'tire' || cls === 'rim'){ o.material = MATS[cls]; return; }
      return;
    }
    var pc = CFG.primClass && CFG.primClass[base];
    if (pc) cls = pc[pidx];
    if (!cls) cls = matClass(matName);
    counters[cls] = (counters[cls] || 0) + 1;
    if (cls === 'hide'){ o.visible = false; return; }
    o.material = MATS[cls] || interiorMat;
    if (cls === 'wrap') wrapTargets.push(o);
  });
  if (CFG.wheelY || CFG.wheelIn){
    model.traverse(o => {
      if (!o.isMesh) return;
      let p = o, nm = '';
      for (let d = 0; d < 4 && p; d++){ if (/^Wheel_(FL|FR|RL|RR)$/.test(p.name)) { nm = p.name; break; } p = p.parent; }
      if (!nm) return;
      // 轮心放置：p 即 Wheel_* 节点，平移到轮拱圆心，轮胎半径落地
      var T2 = window.__THREE;
      var wpv = new T2.Vector3(); p.getWorldPosition(wpv);
      var sign = wpv.x >= 0 ? 1 : -1;
      var targetX = sign * (Math.abs(wpv.x) - (CFG.wheelIn || 0));
      var targetY = (CFG.tireR || 0.335) + (CFG.groundY || 0);
      p.position.x += targetX - wpv.x;
      p.position.y += targetY - wpv.y;
    });
  }
  if (CFG.wheelScale || CFG.wheelFwd || CFG.wheelRise){
    const wnodes = [];
    model.traverse(o => {
      if (!o.isMesh) return;
      let p = o;
      for (let d = 0; d < 4 && p; d++){ if (/^Wheel_(FL|FR|RL|RR)$/.test(p.name)) { if (wnodes.indexOf(p) < 0) wnodes.push(p); break; } p = p.parent; }
    });
    wnodes.forEach(p => {   // 绕节点原点(轮心)缩放，父空间平移，四轮统一
      if (CFG.wheelScale) p.scale.multiplyScalar(CFG.wheelScale);
      if (CFG.wheelFwd)  p.position.x += CFG.wheelFwd;
      if (CFG.wheelRise) p.position.y += CFG.wheelRise;
    });
  }
  if (CFG.groundY) model.position.y += CFG.groundY;
  scene.add(model);
  window.__wrapTargets = wrapTargets;
  hud.textContent = `模型已加载 [${CFG.label}] ` + Object.entries(counters).map(([k,v]) => k + '=' + v).join(' ')
    + ` (用时${Math.round(performance.now() - t0)}ms)`;
  // 独立轮 GLB 运行时装载（3P 的 Wishbone_20 官方轮，含内嵌贴图材质）
  if (CFG.wheelGlb){
    const mounts = CFG.wheelMounts || [
      [1.5, 0.332, -0.725, Math.PI], [1.5, 0.332, 0.725, 0],
      [-1.375, 0.332, -0.73, Math.PI], [-1.375, 0.332, 0.73, 0]];
    const wloader = new GLTFLoader();
    wloader.setMeshoptDecoder(MeshoptDecoder);
    wloader.load(CFG.wheelGlb, (wg) => {
      const proto = wg.scene;
      for (const [x, y, z, ry] of mounts){
        const w = proto.clone();
        w.position.set(x, y, z);
        w.rotation.y = ry;
        w.traverse(c => {
          if (!c.isMesh) return;
          const mn = (Array.isArray(c.material) ? c.material[0].name : c.material.name) || '';
          if (/tire/i.test(mn)) c.material = tireMat;
          else c.material = rimMat;
        });
        model.add(w);
      }
      hud.textContent += ' +轮';
    }, undefined, (e) => { hud.textContent = '轮GLB加载失败: ' + e; });
  }
  if (EMBED){
    // 工坊嵌入：不铺默认模板（避免分区标注色闪现），白底等待工坊推入正式皮肤
    hud.textContent = '模型已加载（等待皮肤推入）';
  } else {
    applyTexture(curTex);
  }
}, (ev) => {
  hud.textContent = '模型加载 ' + ev.loaded + ' / ' + (ev.total || '?');
}, (e) => { hud.textContent = '模型加载失败: ' + e; });

// ---- UI bar ----
const bar = document.getElementById('bar');
function btn(text, fn, on){
  const b = document.createElement('button');
  b.textContent = text;
  if (on) b.classList.add('on');
  b.addEventListener('click', fn);
  bar.appendChild(b);
  return b;
}
// model switcher
for (const [mid, mc] of Object.entries(MODELS)){
  if (!mc.hidden) btn(mid === MODEL_ID ? '● ' + mc.label : mc.label, () => {   // hidden 配置（工坊专用基础版车身）不出按钮，可经 ?m= 直达
    location.search = '?m=' + mid;
  });
}
// template buttons
const texBtns = [];
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const u = URL.createObjectURL(f);
  texBtns.forEach(x => x.classList.remove('on'));
  applyTexture(u);
});
for (const [name, src] of CFG.templates){
  const b = btn(name, () => {
    tryMode = false;
    document.getElementById('trycolor').classList.remove('on');
    document.getElementById('rpanel').style.display = 'none';
    texBtns.forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    applyTexture(src);
  });
  texBtns.push(b);
  if (src === CFG.defaultTex) b.classList.add('on');
}
btn('本地图片', () => fileInput.click());
const tryBtn = btn('分区试色', () => {
  tryMode = !tryMode;
  tryBtn.classList.toggle('on', tryMode);
  document.getElementById('rpanel').style.display = tryMode ? 'block' : 'none';
  if (tryMode){
    if (!CFG.idmap){ hud.textContent = '该车型暂无分区图'; tryMode = false; tryBtn.classList.remove('on'); return; }
    composeTry(); applyComposed();
    hud.textContent = '分区试色中：点上方区域按钮上色';
  } else {
    applyTexture(curTex);
  }
});
tryBtn.id = 'trycolor';
bar.appendChild(fileInput);

// ---- 试色 region buttons ----
if (CFG.idmap){
  const rbtns = document.getElementById('rbtns');
  const idCv = document.createElement('canvas'); idCv.width = 1024; idCv.height = 1024;
  window.__idlog = window.__idlog || [];
  const loadIdmap = (src) => {
    window.__idlog.push('load ' + src.slice(-30));
    const idImg = new Image();
    idImg.onload = () => {
      window.__idlog.push('onload ' + idImg.width + 'x' + idImg.height);
      const cx2 = idCv.getContext('2d', { willReadFrequently: true });
      cx2.drawImage(idImg, 0, 0);
      try {
        idData = cx2.getImageData(0, 0, 1024, 1024);
        window.__idlog.push('idData set, len=' + idData.data.length);
      } catch (e) { window.__idlog.push('getImageData ERR ' + e.message); }
      if (tryMode){ composeTry(); applyComposed(); }
    };
    idImg.onerror = () => { window.__idlog.push('onerror'); setTimeout(() => loadIdmap(CFG.idmap.url + (CFG.idmap.url.includes('?') ? '&' : '?') + 'r=' + Date.now()), 1200); };
    idImg.src = src;
  };
  loadIdmap(CFG.idmap.url);
  for (const [rid, name] of CFG.idmap.regions){
    const b = document.createElement('button');
    b.textContent = name + rid;
    b.style.background = '#2c2c38';
    b.addEventListener('click', () => {
      if (activeRegions.has(rid)) activeRegions.delete(rid); else activeRegions.add(rid);
      b.style.background = activeRegions.has(rid) ? (RCOLOR[rid] || '#3d6dff') : '#2c2c38';
      if (tryMode && idData){ composeTry(); applyComposed(); }
    });
    rbtns.appendChild(b);
  }
}

renderer.setAnimationLoop(() => { controls.update(); fxTick(); renderer.render(scene, camera); });

/* ==== 工坊嵌入桥（2026-10-02，纯增量：不接收消息时与本页独立使用完全一致）====
   工坊 iframe 模式收 2D 设计画布 dataURL → 走与 applyTexture 相同的合成管线
   （composeDesign → CanvasTexture flipY=false channel=1 → wrapTargets）。 */
window.addEventListener('message', (ev) => {
  const d = ev && ev.data;
  if (!d || d.__uvcars !== 1) return;
  if (typeof d.visible === 'boolean'){
    fxVisible = d.visible;                               // 本页自记可见性（fx 动画门控）
    if (window.__setAnim) window.__setAnim(d.visible);   // 隐藏帧暂停渲染
    return;
  }
  if (d.theme === 'light' || d.theme === 'dark'){        // 深浅主题跟随 App 切换（2026-10-04）
    applyTheme(d.theme);
    return;
  }
  if (d.paint){                                          // 真车漆色（登录后自动识别，2026-10-05）
    const hex = /^#[0-9a-fA-F]{6}$/.test(d.paint) ? d.paint : null;
    if (hex){
      [MATS.ext, MATS.paint, MATS.rough, MATS.wrap].forEach(function(m){
        if (m && !m.map) { m.color.set(hex); m.needsUpdate = true; }
      });
    }
    return;
  }
  if (!d.wrap) return;
  const fxHashNow = FX ? fxHash(d.wrap) : '';
  const fxSame = FX && fxHashNow && fxHashNow === fxLastHash;   // 三连发补推：同图不重播动画
  const img = new Image();
  img.onload = () => {
    tryMode = false;
    const canFx = FX && !fxSame && fxVisible && wrapTargets.length
      && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const oldSnap = canFx ? fxClone(composeCv) : null;   // 旧皮快照（新设计画上去之前）
    composeDesign(img);
    if (canFx) fxNewSnap = fxClone(composeCv);           // 新皮快照
    if (!liveTex){
      liveTex = new THREE.CanvasTexture(composeCv);
      liveTex.flipY = false;
      liveTex.colorSpace = THREE.SRGBColorSpace;
      liveTex.channel = 1;
      liveTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      for (const o of wrapTargets){
        const needRe = !o.material.map;   // null→有图 改变 define，需要重编译一次
        o.material.map = liveTex; o.material.color.set(0xffffff);
        o.material.roughness = 0.38; o.material.metalness = 0.05;
        if (needRe) o.material.needsUpdate = true;
      }
    }
    if (canFx){
      if (fxAnim){   // 动画中又换了新设计：立即定格到新皮，重新开始
        const c2 = composeCv.getContext('2d');
        c2.drawImage(fxNewSnap, 0, 0);
        liveTex.needsUpdate = true;
        fxAnim = null;
      }
      fxOldSnap = oldSnap;
      fxBegin();
      fxLastHash = fxHashNow;
    } else {
      liveTex.needsUpdate = true;   // 非动画路径：立即整幅刷新
      if (FX && fxHashNow) fxLastHash = fxHashNow;
    }
    hud.textContent = '工坊设计已上车';
  };
  img.src = d.wrap;
});
</script>
