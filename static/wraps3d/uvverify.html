<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UV 对齐验证 — 仅 Body</title>
<style>
  body{margin:0;overflow:hidden;background:#0b1120;font-family:ui-monospace,monospace;}
  #st{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:14px;z-index:9;text-align:center;}
</style>
<script type="importmap">
{"imports":{"three":"/wraps3d/lib/three.module.js","three/addons/":"/wraps3d/lib/"}}
</script>
</head>
<body>
<div id="st">加载模型…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const st = document.getElementById('st');
const setSt = t => { st.textContent = t; };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(5, 8, 6); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xdde7ff, 0.8); dl2.position.set(-6, 4, -5); scene.add(dl2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);
camera.position.set(4.6, 2.2, 5.6);

// 官方模板贴图（flipY=true：Godot UV 纵向约定）
const texLoader = new THREE.TextureLoader();
texLoader.load('/wraps/modely.png', tex => {
  tex.flipY = true;
  tex.colorSpace = THREE.SRGBColorSpace;

  new GLTFLoader().load('models/ModelY_High_slim.glb', gltf => {
    const car = gltf.scene;
    const box = new THREE.Box3().setFromObject(car);
    car.position.sub(box.getCenter(new THREE.Vector3()));
    scene.add(car);
    let painted = 0;
    car.traverse(o => {
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => {
        if (/^Paint/i.test(m.name)) {
          m.map = tex;
          m.color.set(0xffffff);
          m.needsUpdate = true;
          painted++;
        }
      });
    });
    setSt('✅ Paint ' + painted + ' | 拖动旋转 | flipY=true');
    camera.position.set(4.6, 2.2, 5.6);
    controls.target.set(0, 0.6, 0);
    controls.update();
  }, undefined, e => setSt('模型加载失败: ' + (e.message || e)));
}, undefined, e => setSt('贴图加载失败: ' + (e.message || e)));

(function loop(){ requestAnimationFrame(() => { controls.update(); renderer.render(scene, camera); loop(); }); })();
</script>
</body>
</html>
